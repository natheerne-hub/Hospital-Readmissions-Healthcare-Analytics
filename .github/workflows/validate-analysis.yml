name: Validate Analysis Code

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile analysis script
        run: python -m py_compile analysis/hospital_readmissions_analysis.py
